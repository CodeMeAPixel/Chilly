name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove every token, password and other secret from logs before posting.
        Security issues should be reported privately, see SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Bot / slash commands
        - Playback / Lavalink
        - Radio / AzuraCast
        - API
        - Website / dashboard
        - Deployment / Docker
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /play ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Bot and Lavalink logs around the time of the problem, with secrets removed.
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Lavalink version and plugins, how you deploy (Dokploy, Docker, bare metal), browser if it's a website issue.
